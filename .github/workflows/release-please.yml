name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.actor == 'hackdiaz-dev'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Восстановить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Секрет KEYSTORE_BASE64 не задан"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Собрать подписанный APK
        env:
          CHEB_KEYSTORE: ${{ runner.temp }}/release.jks
          CHEB_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          CHEB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CHEB_KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          VER="${TAG#v}"
          IFS=. read -r MA MI PA <<< "${VER%%[-+]*}"
          export APP_VERSION="$VER"
          export APP_VERSION_CODE=$(( MA*10000 + MI*100 + PA ))
          gradle :app:assembleRelease

      - name: Проверить подпись
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Подготовить файлы релиза
        run: |
          cp app/build/outputs/apk/release/app-release.apk "BlockScan-${TAG}.apk"
          sha256sum "BlockScan-${TAG}.apk" > "BlockScan-${TAG}.apk.sha256"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Добавить файлы в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "BlockScan-${TAG}.apk" "BlockScan-${TAG}.apk.sha256" --clobber
