name: Release

# Релиз: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: github.actor == 'hackdiaz-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Восстановить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Секрет KEYSTORE_BASE64 не задан"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Собрать подписанный APK
        env:
          CHEB_KEYSTORE: ${{ runner.temp }}/release.jks
          CHEB_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          CHEB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CHEB_KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          export APP_VERSION="${GITHUB_REF_NAME#v}"
          gradle :app:assembleRelease

      - name: Проверить подпись
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Подготовить файлы релиза
        run: |
          cp app/build/outputs/apk/release/app-release.apk "BlockScan-${GITHUB_REF_NAME}.apk"
          sha256sum "BlockScan-${GITHUB_REF_NAME}.apk" > "BlockScan-${GITHUB_REF_NAME}.apk.sha256"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "BlockScan-${GITHUB_REF_NAME}.apk" "BlockScan-${GITHUB_REF_NAME}.apk.sha256" \
            --title "БлокСкан ${GITHUB_REF_NAME}" --generate-notes
